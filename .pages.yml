# Settings for the Pages CMS editor (app.pagescms.org).
# This file controls the editing form only. The website's design lives in layout.html and static/styles.css.
media:
  input: static/img/uploads
  output: /img/uploads
  # Give every uploaded file a unique name, so one upload can never overwrite another.
  rename: random
content:
  - name: news
    label: News stories
    type: collection
    path: stories
    filename: "news-{primary}.json"
    format: json
    view:
      primary: title
      fields:
        - title
        - date
        - town
        - draft
      sort: date
      order: desc
    actions:
      - name: publish-story
        label: Publish this story
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Publish this story?
          message: Save first. This story, as last saved, will appear on the public website in a minute or two. No other story is affected. Only editors can publish.
          button: Publish this story
      - name: unpublish-story
        label: Take off live site
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Take this story off the live site?
          message: This story will disappear from the public website in a minute or two. It stays here in the editor as a draft. Only editors can do this.
          button: Take it off
    fields:
      - name: title
        label: Headline
        description: "Preview - about a minute after you click Save, see this story as readers will at drafts.westberkshirevoice.pages.dev/news.html"
        type: string
        required: true
      - name: date
        label: Date and time
        description: Every story must have a date. Stories are listed newest first.
        type: date
        required: true
        options:
          time: true
      - name: town
        label: Town or area
        description: For example Newbury, Thatcham or Hungerford.
        type: string
        required: true
      - name: summary
        label: Summary
        description: One or two sentences shown under the headline and in the news lists.
        type: text
        required: true
      - name: byline
        label: Byline
        description: Optional. The writer's name only. The site adds the word "By" in front. Leave empty for no byline.
        type: string
      - name: image
        label: Picture
        description: House rule - all pictures must be 16:9 landscape. A picture in any other shape will have part of it cut off and is likely not to look good online. Crop it first at drafts.westberkshirevoice.pages.dev/crop.html and upload the cropped picture. Pictures must always be uploaded here, never linked from another website.
        type: image
      - name: imageAlt
        label: Picture description
        description: A short description of what the picture shows, for people who cannot see it.
        type: string
      - name: credit
        label: Picture credit
        description: The provider's name only. The site adds the word "Picture:" in front.
        type: string
      - name: caption
        label: Picture caption
        description: Shown under the main picture, before the credit.
        type: string
      - name: draft
        label: Draft
        description: Shows whether this story is on the live website. You do not need to change it. An editor's Publish this story button unticks it, and Take off live site ticks it again.
        type: boolean
        default: true
      - name: content
        label: Story
        description: Build the story from blocks. Add a Text block for writing and a Picture block wherever a picture should appear. Every picture has its own description, caption and credit.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: text
                label: Text
                type: rich-text
                options:
                  format: html
          - name: picture
            label: Picture
            fields:
              - name: image
                label: Picture
                description: House rule - all pictures must be 16:9 landscape. A picture in any other shape will have part of it cut off and is likely not to look good online. Crop it first at drafts.westberkshirevoice.pages.dev/crop.html and upload the cropped picture. Pictures must always be uploaded here, never linked from another website.
                type: image
                required: true
              - name: imageAlt
                label: Picture description
                description: What the picture shows, for people who cannot see it.
                type: string
                required: true
              - name: caption
                label: Caption
                description: Shown under the picture.
                type: string
              - name: credit
                label: Picture credit
                description: The provider's name only. The site adds the word "Picture:" in front.
                type: string
