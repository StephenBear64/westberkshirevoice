# Settings for the Pages CMS editor (app.pagescms.org).
# This file controls the editing form only. The website's design lives in layout.html and static/styles.css.
media: 
  label: "DO NOT USE"
  input: static/img/uploads
  output: /img/uploads
  # Give every uploaded file a unique name, so one upload can never overwrite another.
  rename: random
  # Only picture formats that every browser can show.
  extensions: [jpg, jpeg, png, webp]
# Keep the Configuration page out of the editor's menu, so the form cannot be changed by accident.
settings:
  hide: true
content:
  - name: news
    label: News stories
    type: collection
    path: stories
    filename: "news-{primary}.json"
    format: json
    view:
      primary: title
      fields:
        - title
        - date
        - town
        - draft
      sort: date
      order: desc
    actions:
      - name: publish-story
        label: Publish (after saving)
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Have you clicked Save?
          message: Publishing sends the last SAVED version of this story to the public website, not what is on your screen. If you have changed anything since you last clicked Save, press Cancel, click Save, then press Publish again. No other story is affected. Only editors can publish.
          button: Yes, publish the saved version
      - name: unpublish-story
        label: Unpublish
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Unpublish this story?
          message: This story will disappear from the public website in a minute or two. It stays here in the editor as a draft. Only editors can do this.
          button: Unpublish
    fields:
      - name: title
        label: Headline
        description: "Preview - about a minute after you click Save, see this story as readers will at drafts.westberkshirevoice.pages.dev/news.html"
        type: string
        required: true
      - name: date
        label: Date and time
        description: Every story must have a date. Stories are listed newest first.
        type: date
        required: true
        options:
          time: true
      - name: town
        label: Town or area
        description: For example Newbury, Thatcham or Hungerford.
        type: string
        required: true
      - name: summary
        label: Summary
        description: One or two sentences shown under the headline and in the news lists.
        type: text
        required: true
      - name: byline
        label: Byline
        description: Optional. The writer's name only. The site adds the word "By" in front. Leave empty for no byline.
        type: string
      - name: image
        label: Picture
        description: "IMPORTANT - All pictures must be 16:9 landscape format. If you attempt to use any other format, the story will fail to publish without warning. There is a cropping tool that you can use at the following web address, which has step-by-step instructions and is easy to use. westberkshirevoice.uk/crop"
        type: image
      - name: imageAlt
        label: Picture description
        description: A short description of what the picture shows, for people who cannot see it.
        type: string
      - name: credit
        label: Picture credit
        description: The provider's name only. The site adds the word "Picture:" in front.
        type: string
      - name: caption
        label: Picture caption
        description: Shown under the main picture, before the credit.
        type: string
      - name: draft
        label: Draft
        description: Shows whether this story is on the live website. You do not need to change it. An editor's Publish button unticks it, and Unpublish ticks it again.
        type: boolean
        default: true
      - name: content
        label: Story
        description: Build the story from blocks. Add a Text block for writing and a Picture block wherever a picture should appear. Every picture has its own description, caption and credit.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: text
                label: Text
                type: rich-text
                options:
                  format: html
          - name: picture
            label: Picture
            fields:
              - name: image
                label: Picture
                description: "IMPORTANT - All pictures must be 16:9 landscape format. If you attempt to use any other format, the story will fail to publish without warning. There is a cropping tool that you can use at the following web address, which has step-by-step instructions and is easy to use. westberkshirevoice.uk/crop"
                type: image
                required: true
              - name: imageAlt
                label: Picture description
                description: What the picture shows, for people who cannot see it.
                type: string
                required: true
              - name: caption
                label: Caption
                description: Shown under the picture.
                type: string
              - name: credit
                label: Picture credit
                description: The provider's name only. The site adds the word "Picture:" in front.
                type: string
  - name: pets
    label: Lost Pets
    type: collection
    path: pets
    filename: "pet-{primary}.json"
    format: json
    view:
      primary: title
      fields:
        - title
        - status
        - date
        - draft
      sort: date
      order: desc
    actions:
      - name: publish-story
        label: Publish (after saving)
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Have you clicked Save?
          message: Publishing sends the last SAVED version of this pet to the public website, not what is on your screen. If you have changed anything since you last clicked Save, press Cancel, click Save, then press Publish again. Nothing else is affected. Only editors can publish.
          button: Yes, publish the saved version
      - name: unpublish-story
        label: Unpublish
        scope: entry
        workflow: publish.yml
        cancelable: false
        confirm:
          title: Unpublish this pet?
          message: This pet will disappear from the public website in a minute or two. It stays here in the editor as a draft. Only editors can do this.
          button: Unpublish
    fields:
      - name: title
        label: Pet's name
        description: "Shown as the headline. Preview - about a minute after you click Save, see it as readers will at drafts.westberkshirevoice.pages.dev/lost-pets.html"
        type: string
        required: true
      - name: petType
        label: Type of pet
        description: For example dog, cat, bird or hamster. Add the breed if you know it.
        type: string
        required: true
      - name: status
        label: Status
        description: Lost pets are listed first, then found, then died. A pet that has died is shown with a rainbow border round its picture.
        type: select
        default: lost
        required: true
        options:
          values:
            - value: lost
              label: Lost
            - value: found
              label: Found
            - value: died
              label: Died
      - name: image
        label: Picture
        description: "IMPORTANT - All pictures must be 16:9 landscape format. If you attempt to use any other format, the pet will fail to publish without warning. There is a cropping tool that you can use at the following web address, which has step-by-step instructions and is easy to use. westberkshirevoice.uk/crop"
        type: image
        required: true
      - name: imageAlt
        label: Picture description
        description: A short description of what the picture shows, for people who cannot see it.
        type: string
      - name: credit
        label: Picture credit
        description: The owner's or photographer's name if it is not our own picture. The site adds the word "Picture:" in front.
        type: string
      - name: caption
        label: Picture caption
        description: Optional. Shown under the picture.
        type: string
      - name: date
        label: Date last seen
        description: Lost pets are listed with the most recently seen first.
        type: date
        required: true
      - name: location
        label: Location last seen
        description: For example a street, village or town.
        type: string
      - name: owner
        label: Owner's name
        type: string
      - name: phone
        label: Owner's phone number
        description: Shown on the website, so check the owner is happy for it to be public.
        type: string
      - name: email
        label: Owner's email address
        description: Shown on the website, so check the owner is happy for it to be public.
        type: string
      - name: draft
        label: Draft
        description: Shows whether this pet is on the live website. You do not need to change it. An editor's Publish button unticks it, and Unpublish ticks it again.
        type: boolean
        default: true
      - name: content
        label: About the pet
        description: The owner's own description. Add a Text block for writing and a Picture block wherever a picture should appear. No heading is shown on the website.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: text
                label: Text
                type: rich-text
                options:
                  format: html
          - name: picture
            label: Picture
            fields:
              - name: image
                label: Picture
                description: "IMPORTANT - All pictures must be 16:9 landscape format. If you attempt to use any other format, the pet will fail to publish without warning. There is a cropping tool that you can use at the following web address, which has step-by-step instructions and is easy to use. westberkshirevoice.uk/crop"
                type: image
                required: true
              - name: imageAlt
                label: Picture description
                description: What the picture shows, for people who cannot see it.
                type: string
                required: true
              - name: caption
                label: Caption
                description: Shown under the picture.
                type: string
              - name: credit
                label: Picture credit
                description: The provider's name only. The site adds the word "Picture:" in front.
                type: string
