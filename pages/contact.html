<div class="prose"><p class="kicker">Contact</p>
<h1>Get in contact</h1>
<p class="lede">Send us a message using this form and we will reply by email.</p>
<form class="form" action="https://formsubmit.co/hello@westberkshirevoice.uk" method="POST">
<input type="hidden" name="_subject" value="Message from the West Berkshire Voice website">
<input type="hidden" name="_next" value="https://www.westberkshirevoice.uk/thanks.html">
<input type="hidden" name="_template" value="table">
<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
<label for="name">Your name</label>
<input id="name" name="name" type="text" autocomplete="name" required>
<label for="email">Your email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="phone">Your phone number (optional)</label>
<input id="phone" name="phone" type="tel" autocomplete="tel">
<label for="message">Your message</label>
<textarea id="message" name="message" rows="7" required></textarea>
<button class="btn btn-navy" type="submit">Send message</button>
</form>
<h2>Other ways to reach us</h2>
<p>Email <a href="mailto:hello@westberkshirevoice.uk">hello@westberkshirevoice.uk</a>, or send us a message through <a href="https://www.facebook.com/westberkshirevoice" target="_blank" rel="noopener">our Facebook page</a>.</p></div>
