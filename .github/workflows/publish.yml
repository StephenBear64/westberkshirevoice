# Runs when an editor presses "Publish this story" or "Take off live site" inside a story in the Pages CMS editor.
# The work is done by tools/publish.js. It moves that one story only.
name: Publish a story
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Pages CMS payload as JSON"
        required: true
        type: string
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish or take down the story
        env:
          PAYLOAD: ${{ inputs.payload }}
          # People allowed to publish: GitHub usernames or email addresses, separated by spaces.
          PUBLISHERS: "StephenBear64"
        run: node tools/publish.js
