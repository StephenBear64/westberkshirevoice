# Runs when an editor presses "Publish to live site" in the Pages CMS editor.
# It copies the drafts copy to the live site, the same as publishing by hand.
name: Publish to live site
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Pages CMS payload as JSON"
        required: false
        type: string
permissions:
  contents: write
concurrency: publish
env:
  # People allowed to publish: GitHub usernames or email addresses, separated by spaces.
  PUBLISHERS: "StephenBear64"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check who pressed the button
        env:
          PAYLOAD: ${{ inputs.payload }}
          ACTOR: ${{ github.actor }}
        run: |
          node -e '
            const allowed = process.env.PUBLISHERS.toLowerCase().split(/\s+/).filter(Boolean);
            let payload = {};
            try { payload = JSON.parse(process.env.PAYLOAD || "{}"); } catch (e) {}
            const found = [], paths = [];
            (function walk(v, p) {
              if (v && typeof v === "object") { for (const k of Object.keys(v)) { if (p === "" && k === "inputs") continue; walk(v[k], p ? p + "." + k : k); } return; }
              paths.push(p);
              if (typeof v === "string" && /(login|username|email|handle)$/i.test(p)) found.push(v.toLowerCase());
            })(payload, "");
            found.push(String(process.env.ACTOR || "").toLowerCase());
            console.log("Details supplied by the editor: " + (paths.join(", ") || "none"));
            if (!found.some((f) => allowed.includes(f))) { console.error("Not published: you are not on the list of people allowed to publish."); process.exit(1); }
            console.log("Publisher approved.");
          '
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bring in the drafts copy
        run: |
          git config user.name "West Berkshire Voice publisher"
          git config user.email "publisher@users.noreply.github.com"
          git fetch origin drafts
          git merge --ff-only origin/drafts || git merge --no-edit origin/drafts
      - name: Check the live site builds
        run: CF_PAGES_BRANCH=main node build.js
      - name: Publish
        run: git push origin HEAD:main
